# Настройки службы ollmcp. Лежат рядом с конфигом ollchat под именем
# ollmcp.toml (другой путь — ключом --mcp-config). Действуют только на
# службу MCP: модель внутри ollchat работает по своим правилам.
#
# Файла нет — всё по умолчанию, как записано ниже. Правку служба
# подхватывает сама примерно за секунду: перезапускается на новых
# настройках с тем же номером процесса, и клиент (Claude Code) получает
# свежий список инструментов с новыми числами в описаниях. Негодная правка
# (опечатка в ключе, предел выше потолка инструмента) не принимается:
# служба остаётся на прежних настройках и пишет причину в поток ошибок.

# Потолок текста ответа любого инструмента, КБ. 0 — как agent.max_output_kb
# в конфиге ollchat; отрицательное — без потолка. Обрезка идёт по границе
# символа с пометкой «[вывод обрезан: показано N из M байт]».
output_kb = 0

# Общий срок одного вызова: "30s", "2m". Пусто — без срока (у звеньев свои:
# вектор вопроса kb.query_timeout, переранжирование kb.rerank_timeout,
# SearXNG web.timeout). Первый вызов после перезапуска службы греет граф
# понятий до двух минут — короткий срок даст на нём ответ «не успела,
# повторите через минуту».
call_timeout = ""

# Следить за этим файлом и перезапускаться на правке.
watch_config = true

# Верхние пределы числовых параметров. 0 — умолчание. Значение больше
# предела служба урезает и пишет об этом в ответе: «top_k = 50 больше
# предела службы 20 — взято 20». Поднять выше потолка самого инструмента
# нельзя — он всё равно урежет; такие значения отвергаются.
[limits]
search_top_k         = 20   # search: выдержек; потолок инструмента 20
kb_read_around       = 5    # kb_read: соседей с каждой стороны; потолок 5
graph_path_max_hops  = 6    # graph_path: шагов пути
graph_overview_top_k = 10   # graph_overview: тем
web_search_limit     = 10   # web_search: ссылок; потолок 10
