# Показательный набор задач для olleval.
#
# Рабочие наборы лежат рядом, в suites/, и в репозиторий не попадают: задача
# с эталоном, оказавшаяся в открытом доступе, через год окажется в обучающей
# выборке — и модель начнёт «решать» её по памяти, а не по умению.
# Этот файл нужен, чтобы было видно, как наборы устроены.

name = "пример"
description = "Как выглядит набор задач"

# ── Проверка сборкой и тестами ───────────────────────────────────────────────
[[task]]
id = "go-u1-median"
level = 1                                  # У1 — мелочь, одна функция
prompt = """
Напиши на Go функцию `Median(v []float64) float64`: медиана среза, для пустого
среза — 0. Исходный срез изменять нельзя. Ответ — один блок кода на Go,
пакет `median`, без пояснений вокруг.
"""
[task.answer]
file = "median.go"                          # куда положить код из ответа
lang = "go"
[task.verify]
kind = "container"
image = "olleval/go"
setup = ["go/median"]                       # что положить рядом: go.mod и наши тесты
timeout = "5m"
[[task.verify.step]]
name = "сборка"
cmd = "go build ./..."
score = 0.3
[[task.verify.step]]
name = "тесты"
cmd = "go test ./..."
score = 0.7

# ── Проверка чек-листом: балл предварительный, окончательный ставит человек ──
[[task]]
id = "devops-u4-vram-spill"
level = 4                                  # У4 — разбор, готового ответа в коде нет
attach = ["devops/ollama-load.log"]        # журнал загрузки прикладывается к вопросу
prompt = """
По этому куску журнала объясни, почему модель отвечает по две минуты вместо
секунд, и что именно надо исправить в настройке сервера.
"""
[task.verify]
kind = "checklist"
[[task.verify.item]]
name = "назвал выезд в оперативную память"
any = ["вытесн", "оперативн", "выгруж", "host memory"]
score = 0.5
[[task.verify.item]]
name = "назвал причину — размер окна контекста"
any = ["num_ctx", "OLLAMA_CONTEXT_LENGTH", "окно контекста"]
score = 0.5
[[task.verify.item]]
name = "выдумал несуществующую переменную окружения"
none = ["OLLAMA_NUM_CTX", "OLLAMA_MAX_CONTEXT"]
score = -0.5                                # штраф: уверенное враньё хуже незнания
